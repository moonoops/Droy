abstract class GenerateBrandResources extends DefaultTask {
    @Input abstract Property<String> getAppName()
    @org.gradle.api.tasks.Optional @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getLogo()
    @OutputDirectory abstract DirectoryProperty getResourcesDirectory()
    @OutputDirectory abstract DirectoryProperty getAssetsDirectory()
    @OutputDirectory abstract DirectoryProperty getNameResourcesDirectory()

    @TaskAction
    void generate() {
        String name = appName.get().trim()
        if (name.isEmpty() || name.codePointCount(0, name.length()) > 40
                || name.codePoints().anyMatch { Character.isISOControl(it) } || name.contains('<') || name.contains('>'))
            throw new GradleException('droyAppName must contain 1–40 characters of plain single-line text.')
        File imageFile = logo.isPresent() ? logo.get().asFile : null
        java.awt.image.BufferedImage image
        if (imageFile == null) image = defaultLogo()
        else {
            if (imageFile.length() > 24 * 1024 * 1024) throw new GradleException('droyAppIcon PNG is too large.')
            def stream = javax.imageio.ImageIO.createImageInputStream(imageFile)
            def readers = javax.imageio.ImageIO.getImageReaders(stream)
            if (!readers.hasNext()) { stream.close(); throw new GradleException('droyAppIcon must be a readable PNG.') }
            def reader = readers.next()
            try {
                reader.input = stream
                int width = reader.getWidth(0), height = reader.getHeight(0)
                if (!reader.formatName.equalsIgnoreCase('PNG') || width < 64 || height < 64 || width > 4096 || height > 4096)
                    throw new GradleException('droyAppIcon must be a PNG between 64 and 4096 pixels per side.')
                image = reader.read(0)
            } finally { reader.dispose(); stream.close() }
        }
        File res = resourcesDirectory.get().asFile, assets = assetsDirectory.get().asFile
        File names = nameResourcesDirectory.get().asFile
        project.delete(res, assets, names)
        new File(names, 'values').mkdirs()
        new File(res, 'drawable-nodpi').mkdirs()
        new File(res, 'drawable-anydpi-v26').mkdirs()
        assets.mkdirs()
        String quotedName = groovy.json.JsonOutput.toJson(name).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
        new File(names, 'values/droy_branding.xml').setText('<resources><string name="droy_app_name" formatted="false" translatable="false">' + quotedName + '</string></resources>\n', 'UTF-8')
        File installedLogo = new File(assets, 'app-brand-logo.png')
        if (imageFile != null) java.nio.file.Files.copy(imageFile.toPath(), installedLogo.toPath())
        else javax.imageio.ImageIO.write(image, 'png', installedLogo)
        for (boolean foreground : [false, true]) {
            def canvas = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = canvas.createGraphics()
            try {
                if (!foreground) { graphics.color = new java.awt.Color(0xF2EEE7); graphics.fillRect(0, 0, 512, 512) }
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                double scale = 336d / Math.max(image.width, image.height)
                int width = Math.max(1, Math.round(image.width * scale) as int), height = Math.max(1, Math.round(image.height * scale) as int)
                graphics.drawImage(image, (512 - width).intdiv(2), (512 - height).intdiv(2), width, height, null)
            } finally { graphics.dispose() }
            javax.imageio.ImageIO.write(canvas, 'png', new File(res, foreground ? 'drawable-nodpi/droy_brand_launcher_foreground.png' : 'drawable-nodpi/droy_brand_launcher.png'))
        }
        new File(res, 'drawable-anydpi-v26/droy_brand_launcher.xml').setText('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/droy_launcher_background" />
    <foreground android:drawable="@drawable/droy_brand_launcher_foreground" />
</adaptive-icon>
''', 'UTF-8')
    }

    // Product identity is independent of pet artwork and host font availability.
    private static java.awt.image.BufferedImage defaultLogo() {
        def image = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = image.createGraphics()
        try {
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.color = new java.awt.Color(0x27313D)
            def mark = new java.awt.geom.Path2D.Double(java.awt.geom.Path2D.WIND_EVEN_ODD)
            mark.moveTo(112, 80); mark.lineTo(242, 80)
            mark.curveTo(352, 80, 400, 144, 400, 256)
            mark.curveTo(400, 368, 352, 432, 242, 432)
            mark.lineTo(112, 432); mark.closePath()
            mark.moveTo(192, 152); mark.lineTo(242, 152)
            mark.curveTo(300, 152, 320, 188, 320, 256)
            mark.curveTo(320, 324, 300, 360, 242, 360)
            mark.lineTo(192, 360); mark.closePath()
            graphics.fill(mark)
        } finally { graphics.dispose() }
        return image
    }
}

def generateBrandResources = tasks.register('generateBrandResources', GenerateBrandResources) {
    appName.set(providers.gradleProperty('droyAppName').orElse(brandingSpec.name as String))
    logo.set(rootProject.layout.file(providers.gradleProperty('droyAppIcon').map { rootProject.file(it) }))
    resourcesDirectory.set(layout.buildDirectory.dir('generated/droyBranding/res'))
    assetsDirectory.set(layout.buildDirectory.dir('generated/droyBranding/assets'))
    nameResourcesDirectory.set(layout.buildDirectory.dir('generated/droyBranding/nameRes'))
}

abstract class GenerateDevelopmentResources extends DefaultTask {
    @Input abstract Property<String> getAppName()
    @OutputDirectory abstract DirectoryProperty getResourcesDirectory()

    @TaskAction
    void generate() {
        File res = resourcesDirectory.get().asFile
        project.delete(res)
        def names = [
            'values': [appName.get() + ' Dev', 'Droy Dev phone control', 'Droy Dev notification management'],
            'values-zh': [appName.get() + ' 开发版', 'Droy 开发版手机操作', 'Droy 开发版通知管理']
        ]
        names.each { directory, labels ->
            File values = new File(res, directory)
            values.mkdirs()
            def entries = ['droy_app_name', 'droy_accessibility_service', 'droy_notification_service'].withIndex().collect { key, index ->
                String value = groovy.json.JsonOutput.toJson(labels[index]).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                '<string name="' + key + '" formatted="false">' + value + '</string>'
            }
            new File(values, 'droy_development.xml').setText('<resources>' + entries.join('') + '</resources>\n', 'UTF-8')
        }
    }
}

def generateDevelopmentResources = tasks.register('generateDevelopmentResources', GenerateDevelopmentResources) {
    dependsOn generateBrandResources
    appName.set(providers.gradleProperty('droyAppName').orElse(brandingSpec.name as String))
    resourcesDirectory.set(layout.buildDirectory.dir('generated/droyDevelopment/res'))
}

abstract class VerifyRuntimeRelease extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getReleaseManifest()

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getAssetManifest()

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getRuntimeArchive()

    @TaskAction
    void verify() {
        def parser = new groovy.json.JsonSlurper()
        def expected = parser.parse(releaseManifest.get().asFile)
        def packaged = parser.parse(assetManifest.get().asFile)
        for (String field : ['droyVersion', 'dshVersion', 'mobileVersion']) {
            if (!(expected[field] instanceof String) || expected[field].trim().isEmpty()
                    || expected[field] != packaged[field]) {
                throw new GradleException("Runtime release mismatch: ${field}. Run node tools/prepare_dsh.mjs before building.")
            }
        }
        if (!(expected.versionCode instanceof Integer) || expected.versionCode < 1
                || !(packaged.versionCode instanceof Integer) || expected.versionCode != packaged.versionCode) {
            throw new GradleException('Runtime release mismatch: versionCode. Run node tools/prepare_dsh.mjs before building.')
        }
        if (!(packaged.sha256 instanceof String) || !(packaged.sha256 ==~ /[a-f0-9]{64}/)) {
            throw new GradleException('Runtime asset manifest has no valid SHA-256.')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        runtimeArchive.get().asFile.withInputStream { input ->
            byte[] buffer = new byte[32768]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != packaged.sha256) {
            throw new GradleException('Runtime archive checksum mismatch. Run node tools/prepare_dsh.mjs before building.')
        }
    }
}

def verifyRuntimeRelease = tasks.register('verifyRuntimeRelease', VerifyRuntimeRelease) {
    releaseManifest.set(rootProject.layout.projectDirectory.file('runtime/release.json'))
    assetManifest.set(rootProject.layout.projectDirectory.file('runtime/generated/assets/dsh-runtime.json'))
    runtimeArchive.set(rootProject.layout.projectDirectory.file('runtime/generated/assets/dsh-runtime.zip'))
}
abstract class VerifyBundledAudio extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getManifest()

    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getModelsDirectory()

    @TaskAction
    void verify() {
        def manifest = new groovy.json.JsonSlurper().parse(getManifest().get().asFile)
        for (def asset : manifest.files) {
            File model = new File(modelsDirectory.get().asFile, asset.name as String)
            if (!model.isFile() || model.length() != asset.bytes)
                throw new GradleException("Missing bundled speech resource: ${asset.name}. Run python3 tools/prepare_audio.py.")
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            model.withInputStream { input ->
                byte[] buffer = new byte[262144]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != asset.sha256)
                throw new GradleException("Bundled speech resource checksum mismatch: ${asset.name}. Run python3 tools/prepare_audio.py.")
        }
    }
}

def verifyBundledAudio = tasks.register('verifyBundledAudio', VerifyBundledAudio) {
    manifest.set(layout.projectDirectory.file('src/main/assets/audio-models.json'))
    modelsDirectory.set(rootProject.layout.projectDirectory.dir('runtime/generated/assets/audio-models/sensevoice-int8'))
}
tasks.named('preBuild').configure { dependsOn verifyRuntimeRelease, generateBrandResources, verifyBundledAudio }

def verifyQwenRuntime = tasks.register('verifyQwenRuntime') {
    def library = rootProject.layout.projectDirectory.file('runtime/generated/jniLibs/arm64-v8a/libdroy_qwen_tts.so')
    inputs.file(library)
    doLast {
        if (!library.asFile.isFile()) throw new GradleException('Missing Qwen3-TTS runtime. Run python3 tools/prepare_qwen_tts.py with the Android NDK and CMake.')
    }
}
tasks.named('preBuild').configure { dependsOn verifyQwenRuntime }

def verifyEmbeddingRuntime = tasks.register('verifyEmbeddingRuntime') {
    def library = rootProject.layout.projectDirectory.file('runtime/generated/jniLibs/arm64-v8a/libdroy_embedding.so')
    def manifest = rootProject.layout.projectDirectory.file('runtime/generated/assets/embedding/e5-small/manifest.json')
    inputs.files(library, manifest)
    doLast {
        if (!library.asFile.isFile() || !manifest.asFile.isFile())
            throw new GradleException('Missing local embedding resources. Run python3 tools/prepare_embedding.py with the Android NDK and CMake.')
    }
}
tasks.named('preBuild').configure { dependsOn verifyEmbeddingRuntime }

android {
    namespace 'io.droyagent.app'
    compileSdk 37
    buildFeatures { compose true }
    defaultConfig {
        applicationId 'io.droyagent.app'
        minSdk 30
        targetSdk 36
        versionCode releaseSpec.versionCode
        versionName releaseSpec.droyVersion
        manifestPlaceholders.droyLauncherIcon = '@drawable/droy_brand_launcher'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        jniLibs.srcDirs += [new File(nodeRuntimeDir, 'jniLibs'), '../runtime/generated/jniLibs']
        assets.srcDirs += [new File(nodeRuntimeDir, 'assets'), '../runtime/generated/assets', '../runtime/mobile/assets']
    }
    packaging {
        jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            signingConfig signingConfigs.debug
        }
        release { minifyEnabled false }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(generateBrandResources) { it.resourcesDirectory }
        variant.sources.assets.addGeneratedSourceDirectory(generateBrandResources) { it.assetsDirectory }
    }
    // Generated resource directories have equal priority. Keep the release name
    // separate so debug uses only its paired development labels.
    onVariants(selector().withBuildType('release')) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(generateBrandResources) { it.nameResourcesDirectory }
    }
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(generateDevelopmentResources) { it.resourcesDirectory }
    }
}

