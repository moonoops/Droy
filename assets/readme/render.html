<body><main id="art" class="canvas"></main>
<script type="module">
const q=new URLSearchParams(location.search);const zh=q.get('lang')==='zh-CN';const lang=zh?'zh-CN':'en';const everyday=q.get('view')==='everyday';
const text=zh?{edition:'ANDROID · 开源 · v0.0.3',eyebrow:'陪伴与行动，都在手机里',heading:'你的 AI 伙伴，<br>也是手机 Agent。',body:'聊日常，延续共同的记忆。<br>说出目标，让手机开始行动。',left:'与你相处',right:'替你做事',cat:'有一点性格。<br>有很多可能。',foot:'你的模型 · 你的伙伴 · 你的授权',sub:'让每一次打开，都更像你。',intro:'独立的伙伴、喜欢的背景，还有屏幕上的一点陪伴。',labels:['认识你的伙伴','换一种聊天氛围','屏幕上的小伙伴'],captions:['四套预设，按需添加','八套背景，也可自定义','黑猫、土拨鼠、羊驼']}:{edition:'ANDROID · OPEN SOURCE · v0.0.3',eyebrow:'COMPANY MEETS CAPABILITY',heading:'Your AI companion.<br>Your phone agent.',body:'Conversations that carry on.<br>A phone that can lend a hand.',left:'Good company.',right:'Real help.',cat:'A little personality.<br>A lot of possibility.',foot:'Your model. Your companions. Your permissions.',sub:'Make it feel like yours.',intro:'Distinct companions. Your kind of atmosphere. A little company on screen.',labels:['Meet your companions','Set the atmosphere','A little company'],captions:['Four presets. Add your favorites.','Eight backgrounds, or your own.','Black cat, marmot or alpaca.']};
const phone=(name,label,num,caption='')=>`<section class="phone-wrap"><div class="phone-label"><span>${num}</span><b>${label}</b></div><div class="phone"><div class="screen"><img src="screenshots/${name}.${lang}.png" alt="Droy ${name}"><i class="camera"></i></div></div>${caption?`<div class="caption">${caption}</div>`:''}</section>`;
const art=document.querySelector('#art');art.className='canvas'+(zh?' zh':'')+(everyday?' everyday':'');document.documentElement.lang=lang;
const top=`<div class="top"><span class="brand">Droy<span style="color:#9e86d5">.</span></span><div class="rule"></div><span class="edition">${text.edition}</span></div>`;
art.innerHTML=everyday?`${top}<div class="subtitle">${text.sub}</div><div class="intro">${text.intro}</div><div class="gallery">${['companions','background','pet'].map((n,i)=>phone(n,text.labels[i],String(i+1).padStart(2,'0'),text.captions[i])).join('')}</div><div class="foot"><span>${text.foot}</span><span>github.com/moonoops/Droy</span></div>`:`${top}<div class="backdrop"></div><div class="copy"><div class="eyebrow">${text.eyebrow}</div><h1>${text.heading}</h1><p>${text.body}</p></div><img class="cat" src="brand-cat.png" alt="Droy black cat promotional illustration"><div class="cat-note">${text.cat}</div><div class="phones">${phone('chat',text.left,'01')}${phone('tasks',text.right,'02')}</div><div class="foot"><span>${text.foot}</span><span>github.com/moonoops/Droy</span></div>`;
</script>
